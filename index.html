<!doctype html>
<html lang="en" data-theme="light" data-text-size="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Content Security Policy. Everything is same-origin except what the optional on-device AI needs on the
      hosted demo: model weights (Hugging Face) and its WebGPU kernel library (raw.githubusercontent.com).
      No user data is ever sent; 'wasm-unsafe-eval' lets the in-browser model runtime compile WebAssembly.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Kinwise — family medicine-review co-pilot</title>
    <meta
      name="description"
      content="Kinwise is a private, on-device co-pilot that helps families notice possible medication side effects in older adults early and bring a clear, evidence-backed question to the doctor or pharmacist. Fictional demo data."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/source-serif-4-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5">
        Kinwise runs entirely in your browser and needs JavaScript turned on. Nothing you enter is sent to a server.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
